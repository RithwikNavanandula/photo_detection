<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorizations - Label Scanner</title>
    <style>
        :root {
            --bg: #f5f8fd;
            --panel: #ffffff;
            --panel-soft: #f7fbff;
            --accent: #1768a6;
            --accent2: #4f8fc1;
            --accent-soft: #e8f2fb;
            --text: #203345;
            --text2: #6d8195;
            --success: #2a9d67;
            --warning: #c7921c;
            --error: #d85a64;
            --border: #d7e2ec;
            --border-strong: #c6d5e2;
            --shadow: 0 20px 56px rgba(16, 52, 87, 0.08);
            --shadow-soft: 0 12px 30px rgba(16, 52, 87, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(23, 104, 166, 0.08), transparent 28%),
                radial-gradient(circle at top right, rgba(79, 143, 193, 0.14), transparent 20%),
                linear-gradient(180deg, #f8fbfe 0%, #edf3fa 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(23, 104, 166, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 104, 166, 0.022) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.28), transparent 85%);
        }

        .sidebar {
            width: 248px;
            min-height: calc(100vh - 32px);
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 18px 14px;
            position: fixed;
            left: 16px;
            top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .sidebar-logo {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(23, 104, 166, 0.08), rgba(79, 143, 193, 0.22));
            color: var(--accent);
            font-size: 1.02rem;
            font-weight: 800;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: none;
            border-radius: 18px;
            background: transparent;
            color: var(--text2);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .sidebar-btn:hover {
            background: rgba(23, 104, 166, 0.08);
            color: var(--text);
            transform: translateX(3px);
        }

        .sidebar-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 12px 24px rgba(23, 104, 166, 0.22);
        }

        .sidebar-btn.danger { color: var(--error); }
        .sidebar-btn.danger:hover { background: rgba(216, 90, 100, 0.1); color: #b94b55; }

        .sidebar-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
            margin: 10px 10px 4px;
        }

        .sidebar-section {
            font-size: 0.72rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 8px 14px 2px;
            margin-top: 2px;
            font-weight: 800;
        }

        .main-content {
            flex: 1;
            margin-left: 296px;
            padding: 24px 24px 40px;
            max-width: calc(100% - 296px);
        }

        .container { max-width: 1480px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px 24px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.86);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(16px);
        }

        .header h1 {
            font-size: clamp(1.4rem, 2vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .header p {
            color: var(--text2);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .header .badge {
            margin-top: 0;
            align-self: center;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid #d2e5f5;
            box-shadow: none;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
        }

        .panel {
            background: rgba(255,255,255,0.86);
            border: 1px solid rgba(215,226,236,0.95);
            border-radius: 26px;
            padding: 20px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(14px);
        }

        .panel h2 {
            font-size: 1rem;
            margin-bottom: 14px;
            font-weight: 800;
            color: var(--text);
        }

        .search {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: #f5f8fc;
            color: var(--text);
            outline: none;
            margin-bottom: 12px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .user-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .user-dropdown {
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #f8fbfe;
            overflow: hidden;
        }

        .user-dropdown summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 16px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            list-style: none;
        }

        .user-dropdown summary::-webkit-details-marker { display: none; }

        .user-dropdown summary::after {
            content: '⌄';
            color: var(--accent);
            font-size: 1.1rem;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .user-dropdown:not([open]) summary::after {
            transform: rotate(-90deg);
        }

        .user-dropdown-count {
            margin-left: auto;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.72rem;
        }

        .user-dropdown-list {
            display: grid;
            gap: 8px;
            padding: 0 8px 8px;
        }

        .user-card {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
            border-radius: 18px;
            min-height: 112px;
            padding: 14px 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16,52,87,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .user-card.active {
            border-color: rgba(23, 104, 166, 0.55);
            box-shadow: 0 0 0 1px rgba(23, 104, 166, 0.16) inset, 0 12px 24px rgba(23, 104, 166, 0.08);
        }

        .user-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(16,52,87,0.08);
        }

        .user-card h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--text);
        }

        .user-card p {
            color: var(--text2);
            font-size: 0.85rem;
        }

        .user-panel {
            padding-bottom: 16px;
        }

        .user-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .user-panel-header h2 {
            margin-bottom: 0;
        }

        .user-panel .search {
            width: min(340px, 100%);
            margin-bottom: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid #d4e6f5;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .meta {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
            border-radius: 18px;
            padding: 12px 14px;
        }

        .meta strong {
            display: block;
            color: var(--text2);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .meta span { color: var(--text); font-size: 0.95rem; }

        .permission-groups {
            display: grid;
            gap: 14px;
        }

        .perm-group {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px;
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
        }

        .perm-group h3 {
            font-size: 0.78rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text2);
            font-weight: 800;
        }

        .perm-list {
            display: grid;
            gap: 10px;
        }

        .perm-columns {
            display: grid;
            grid-template-columns: 32px minmax(220px, 0.8fr) minmax(260px, 1.2fr);
            gap: 12px;
            padding: 0 14px 2px;
            color: var(--text2);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .perm-columns span:first-of-type {
            grid-column: 2;
        }

        .perm-item {
            display: grid;
            grid-template-columns: 32px minmax(220px, 0.8fr) minmax(260px, 1.2fr);
            gap: 12px;
            align-items: flex-start;
            padding: 12px 14px;
            border-radius: 16px;
            background: #f6f9fc;
            border: 1px solid var(--border);
        }

        .perm-item.info {
            grid-template-columns: minmax(0, 1fr);
        }

        .perm-item input {
            justify-self: center;
            margin-top: 2px;
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .perm-item input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .perm-copy {
            min-width: 0;
        }

        .perm-copy.description {
            color: var(--text2);
            font-size: 0.82rem;
            line-height: 1.35;
            padding-top: 1px;
        }

        .perm-copy strong {
            display: block;
            font-size: 0.92rem;
            color: var(--text);
            line-height: 1.3;
        }

        .perm-copy span {
            display: block;
            color: var(--text2);
            font-size: 0.82rem;
            margin-top: 3px;
            line-height: 1.35;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 12px 24px rgba(23, 104, 166, 0.18);
        }

        .btn-secondary {
            background: #f5f8fc;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .status {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            display: none;
        }
        .status.success { display: block; background: rgba(42,157,103,0.10); border: 1px solid rgba(42,157,103,0.22); color: #17724d; }
        .status.error { display: block; background: rgba(216,90,100,0.10); border: 1px solid rgba(216,90,100,0.22); color: #b94b55; }

        .empty-state {
            display: block;
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
            border: 1px solid var(--border);
            color: var(--text2);
            box-shadow: var(--shadow-soft);
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 80px;
                left: 12px;
                top: 12px;
                padding: 14px 10px;
                border-radius: 24px;
                min-height: calc(100vh - 24px);
            }

            .sidebar-logo {
                font-size: 0.95rem;
                text-align: center;
                justify-content: center;
            }

            .sidebar-btn span { display: none; }
            .sidebar-section { display: none; }

            .main-content {
                margin-left: 108px;
                max-width: calc(100% - 108px);
                padding: 18px 16px 28px;
            }

            .grid { grid-template-columns: 1fr; }
            .user-list { max-height: none; }
            .meta-grid { grid-template-columns: 1fr; }
            .perm-columns { grid-template-columns: 32px minmax(0, 1fr); }
            .perm-columns span:last-of-type { display: none; }
            .perm-item { grid-template-columns: 32px minmax(0, 1fr); }
            .perm-copy.description { grid-column: 2; padding-top: 0; }
        }

        @media (max-width: 620px) {
            .user-list { grid-template-columns: 1fr; }
        }

        @media (max-width: 720px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 18px;
                border-radius: 22px;
            }

            .panel {
                padding: 16px;
                border-radius: 22px;
            }

            .user-panel-header {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .user-panel .search {
                width: 100%;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="css/dashboard-theme.css">
</head>
<body class="dashboard-shell">
    <nav class="sidebar">
        <div class="sidebar-logo">🛠️ Admin Panel</div>

        <div class="sidebar-section">Navigation</div>
        <button class="sidebar-btn" onclick="location.href='/admin'">📊 <span>Dashboard</span></button>
        <button class="sidebar-btn" onclick="location.href='/pivot'">📈 <span>Ledger Entries</span></button>
        <button class="sidebar-btn" onclick="location.href='/analytics'">📉 <span>Analytics</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer'">🚚 <span>Transfer Request</span></button>
        <button class="sidebar-btn active" onclick="location.href='/authorizations'">🔐 <span>Authorizations</span></button>
        <button class="sidebar-btn" onclick="location.href='/users'">👥 <span>Users</span></button>
        <button class="sidebar-btn" onclick="location.href='/branches'">🏢 <span>Branches &amp; Houses</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section">Actions</div>
        <button class="sidebar-btn" onclick="location.href='/app'">📷 <span>Scanner</span></button>
        <button class="sidebar-btn danger" onclick="logout()">🚪 <span>Logout</span></button>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="header">
                <div>
                    <h1>Authorizations</h1>
                    <p>Grant granular permissions to users without using an admin role.</p>
                </div>
                <div class="badge">Superadmin only</div>
            </div>

            <div class="grid">
                <div class="panel user-panel">
                    <div class="user-panel-header">
                        <h2>Users</h2>
                        <input id="search" class="search" type="text" placeholder="Search users..." oninput="renderUserList()">
                    </div>
                    <div id="user-list" class="user-list">
                        <div class="user-card">Loading...</div>
                    </div>
                </div>

                <div class="panel editor-panel">
                    <h2>Permission Editor</h2>
                    <div id="empty-state" class="empty-state">
                        Select a user to edit permissions.
                    </div>

                    <div id="editor" style="display:none;">
                        <div class="meta-grid">
                            <div class="meta"><strong>User</strong><span id="meta-user">-</span></div>
                            <div class="meta"><strong>Role</strong><span id="meta-role">-</span></div>
                            <div class="meta"><strong>Branch</strong><span id="meta-branch">-</span></div>
                            <div class="meta"><strong>Permission Count</strong><span id="meta-count">0</span></div>
                        </div>

                        <div id="groups" class="permission-groups"></div>

                        <div id="editor-actions" class="actions">
                            <button class="btn btn-primary" onclick="savePermissions()">Save Permissions</button>
                            <button class="btn btn-secondary" onclick="reloadUser()">Reload</button>
                        </div>

                        <div id="status" class="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let auth = null;
        let users = [];
        let permissions = [];
        let selectedUser = null;
        const MANDATORY_PERMISSION_CODES = new Set(['view_scanner', 'sync_scans']);

        function showStatus(text, type) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = text;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function normalizeGroup(group) {
            return (group || 'general').replaceAll('_', ' ');
        }

        function requireSuperadmin(data) {
            if (!data.authenticated || data.role !== 'superadmin') {
                window.location.href = '/';
                return false;
            }
            return true;
        }

        fetch('/api/check-auth')
            .then(r => r.json())
            .then(data => {
                if (!requireSuperadmin(data)) return;
                auth = data;
                loadData();
            });

        async function loadData() {
            const res = await fetch('/api/admin/authorizations');
            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'Failed to load authorizations');
                return;
            }
            users = data.users || [];
            permissions = data.permissions || [];
            renderUserList();
            const firstEditable = users.find(u => u.role !== 'superadmin') || users[0];
            if (firstEditable) {
                selectUser(firstEditable.id);
            }
        }

        function renderUserList() {
            const container = document.getElementById('user-list');
            const q = (document.getElementById('search').value || '').toLowerCase().trim();
            const filtered = users.filter(user => {
                const hay = `${user.name || ''} ${user.username || ''} ${user.branch_name || ''}`.toLowerCase();
                return !q || hay.includes(q);
            });

            const userGroups = [
                { label: 'Users', users: filtered.filter(user => user.role !== 'superadmin') },
                { label: 'Superadmins', users: filtered.filter(user => user.role === 'superadmin') }
            ];

            container.innerHTML = userGroups.map(group => `
                <details class="user-dropdown" open>
                    <summary>
                        <span>${group.label}</span>
                        <span class="user-dropdown-count">${group.users.length}</span>
                    </summary>
                    <div class="user-dropdown-list">
                        ${group.users.length ? group.users.map(user => `
                            <div class="user-card ${selectedUser && selectedUser.id === user.id ? 'active' : ''}" onclick="selectUser(${user.id})">
                                <h3>${escapeHtml(user.name || user.username)}</h3>
                                <p>@${escapeHtml(user.username)}</p>
                                <p>${escapeHtml(user.branch_name || 'No branch')}</p>
                                <span class="badge">${escapeHtml(user.role)}</span>
                            </div>
                        `).join('') : '<div class="user-card">No matching users.</div>'}
                    </div>
                </details>
            `).join('');
        }

        async function selectUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            selectedUser = user;
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('editor').style.display = 'block';
            document.getElementById('meta-user').textContent = `@${user.username} (${user.name || '-'})`;
            document.getElementById('meta-role').textContent = user.role;
            document.getElementById('meta-branch').textContent = user.branch_name || 'All branches';
            renderUserList();

            const actions = document.getElementById('editor-actions');

            if (user.role === 'superadmin') {
                document.getElementById('groups').innerHTML = `
                    <div class="perm-group">
                        <h3>Superadmin</h3>
                        <div class="perm-list">
                            <div class="perm-item info">
                                <div class="perm-copy">
                                    <strong>All permissions</strong>
                                    <span>Superadmin access is implicit and cannot be changed here.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('meta-count').textContent = 'All';
                actions.style.display = 'none';
                document.getElementById('status').className = 'status';
                document.getElementById('status').textContent = '';
                return;
            }

            actions.style.display = 'flex';
            const res = await fetch(`/api/admin/users/${id}/permissions`);
            const data = await res.json();
            const assigned = new Set(data.permissions || user.permissions || []);
            document.getElementById('meta-count').textContent = String(assigned.size);

            const grouped = {};
            permissions.forEach(permission => {
                const group = permission.permission_group || 'general';
                if (!grouped[group]) grouped[group] = [];
                grouped[group].push(permission);
            });

            document.getElementById('groups').innerHTML = Object.entries(grouped).map(([group, items]) => `
                <div class="perm-group">
                    <h3>${escapeHtml(normalizeGroup(group))}</h3>
                    <div class="perm-columns" aria-hidden="true">
                        <span>Permission</span>
                        <span>Description</span>
                    </div>
                    <div class="perm-list">
                        ${items.map(permission => `
                            <label class="perm-item">
                                <input type="checkbox" value="${escapeHtml(permission.code)}" ${assigned.has(permission.code) || MANDATORY_PERMISSION_CODES.has(permission.code) ? 'checked' : ''} ${MANDATORY_PERMISSION_CODES.has(permission.code) ? 'disabled' : ''}>
                                <div class="perm-copy">
                                    <strong>${escapeHtml(permission.label)}${MANDATORY_PERMISSION_CODES.has(permission.code) ? ' (locked)' : ''}</strong>
                                </div>
                                <div class="perm-copy description">${escapeHtml(permission.description || permission.code)}</div>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function reloadUser() {
            if (!selectedUser) return;
            await selectUser(selectedUser.id);
        }

        async function savePermissions() {
            if (!selectedUser) return;
            const checked = Array.from(document.querySelectorAll('#groups input[type="checkbox"]:checked'))
                .map(input => input.value);
            const merged = Array.from(new Set([...checked, ...MANDATORY_PERMISSION_CODES]));

            try {
                const res = await fetch(`/api/admin/users/${selectedUser.id}/permissions`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ permissions: merged })
                });
                const data = await res.json();
                if (!data.success) {
                    showStatus(data.error || 'Failed to save permissions', 'error');
                    return;
                }
                showStatus('Permissions saved.', 'success');
                await loadData();
                selectedUser = users.find(u => u.id === selectedUser.id) || selectedUser;
                await selectUser(selectedUser.id);
            } catch (err) {
                showStatus('Network error while saving permissions.', 'error');
            }
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => window.location.href = '/');
        }
    </script>
</body>
</html>
