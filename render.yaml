services:
  - type: web
    name: label-scanner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/check-auth
    disk:
      name: label-scanner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: DB_PATH
        value: /var/data/users.db
      - key: SCAN_PHOTOS_DIR
        value: /var/data/scan_photos
      - key: FLASK_ORIGIN
        value: http://127.0.0.1:5000
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
