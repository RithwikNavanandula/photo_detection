<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBC Tanzania - Sign In</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #0A67AE;
            --blue-dark: #074b80;
            --yellow: #F6B426;
            --text-dark: #1F2937;
            --text-gray: #6B7280;
            --bg-input: #F3F4F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background-color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Left Panel */
        .left-panel {
            width: 50%;
            padding: 50px 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            background: #fff;
        }

        .logo-container {
            position: absolute;
            top: 50px;
            left: 10%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            background: conic-gradient(from 180deg at 50% 50%, var(--blue) 0deg, #1fa2ff 180deg, var(--blue) 360deg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(10, 103, 174, 0.3);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--blue);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .logo-sub {
            font-size: 9px;
            color: var(--blue);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .login-box {
            max-width: 380px;
            margin-top: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box h1 {
            font-size: 38px;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .login-box p {
            color: var(--text-gray);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-input);
            border: 1.5px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #9CA3AF;
        }

        .form-control:focus {
            outline: none;
            background: #fff;
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(10, 103, 174, 0.1);
        }

        .show-password {
            position: absolute;
            right: 16px;
            bottom: 16px;
            color: var(--blue);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.2s;
        }

        .show-password:hover {
            color: var(--blue-dark);
        }

        .btn-signin {
            width: 100%;
            padding: 8px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(10, 103, 174, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .btn-signin:hover {
            background: var(--blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(10, 103, 174, 0.35);
        }

        .btn-signin:active {
            transform: translateY(0);
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn-text {
            flex: 1;
            text-align: center;
            padding-right: 36px;
        }

        .footer-text {
            position: absolute;
            bottom: 50px;
            left: 10%;
            font-size: 12px;
            color: #9CA3AF;
            font-weight: 500;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FCA5A5;
            font-weight: 500;
        }

        .alert.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* Right Panel */
        .right-panel {
            width: 50%;
            background: linear-gradient(135deg, #1282c9 0%, #085591 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            color: white;
            overflow: hidden;
        }

        /* The stylized golden map shape */
        .map-graphic {
            position: absolute;
            right: -15%;
            top: 50%;
            transform: translateY(-50%);
            width: 120%;
            height: 120%;
            background: var(--yellow);
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M70 20 Q 80 30 90 20 T 100 40 Q 95 60 85 80 T 60 100 Q 40 95 20 80 T 0 60 Q 10 40 20 20 T 50 0 Q 60 10 70 20 Z" /></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M70 20 Q 80 30 90 20 T 100 40 Q 95 60 85 80 T 60 100 Q 40 95 20 80 T 0 60 Q 10 40 20 20 T 50 0 Q 60 10 70 20 Z" /></svg>');
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center right;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center right;
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(-10px 0 30px rgba(0, 0, 0, 0.15));
        }

        .content-right {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin-left: auto;
            margin-right: 0;
            padding-left: 20px;
        }

        .command-center {
            font-size: 10.5px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .hero-text {
            font-size: 54px;
            line-height: 1.12;
            font-weight: 600;
            margin-bottom: 35px;
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        .features {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 55px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
        }

        .features span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .features span::before {
            content: '•';
            font-size: 18px;
            color: var(--yellow);
        }

        .brands-title {
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        .brands-logos {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .brand-circle {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .brand-circle:hover {
            transform: scale(1.15) translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Center Bottle */
        .pepsi-bottle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            height: 82vh;
            z-index: 10;
            filter: drop-shadow(15px 25px 35px rgba(0, 0, 0, 0.45));
        }

        /* Loading Spinner */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <img src="/pics/pepsi_bottle.png" alt="Pepsi Bottle" class="pepsi-bottle">

    <div class="left-panel">
        <div class="logo-container">
            <img src="/pics/sbc_logo.png" alt="SBC Tanzania" style="height: 55px; width: auto;">
        </div>

        <div class="login-box">
            <h1>Sign in</h1>
            <p>Welcome back — please enter your details.</p>

            <div class="alert" id="login-error"></div>

            <div class="form-group">
                <label for="username">User ID</label>
                <input type="text" id="username" class="form-control" placeholder="34001">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
                <button type="button" class="show-password" onclick="togglePassword()">Show</button>
            </div>

            <button class="btn-signin" id="btn-login" onclick="doLogin()">
                <span class="btn-icon">→</span>
                <span class="btn-text">Sign in</span>
            </button>
        </div>

        <div class="footer-text">
            Powered by rymaAI
        </div>
    </div>

    <div class="right-panel">
        <div class="map-graphic"></div>

        <div class="content-right">
            <div class="command-center">FIELDFORCE COMMAND CENTER</div>
            <h1 class="hero-text">It's about what<br>you make<br>possible.</h1>

            <div class="features">
                <span>Live deliveries</span>
                <span>Sales & orders</span>
                <span>25 years strong</span>
            </div>

            <div class="brands-title">BRANDS WE MOVE</div>
            <div class="brands-logos">
                <div class="brand-circle"><img
                        src="https://upload.wikimedia.org/wikipedia/commons/4/42/Mirinda_logo.svg" style="height:22px;">
                </div>
                <div class="brand-circle"><img
                        src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Pepsi_logo_2014.svg"
                        style="height:28px;"></div>
                <div class="brand-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/9/91/7up_logo.svg"
                        style="height:28px;"></div>
                <div class="brand-circle"><img
                        src="https://upload.wikimedia.org/wikipedia/commons/9/93/Mountain_Dew_logo.svg"
                        style="height:18px;"></div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = document.querySelector('.show-password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = 'Hide';
            } else {
                pwd.type = 'password';
                btn.textContent = 'Show';
            }
        }

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');

            errBox.classList.remove('show');

            if (!username || !password) {
                errBox.textContent = 'Please enter both User ID and Password';
                errBox.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.querySelector('.btn-text').innerHTML = '<div class="spinner"></div>';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    const cb = '?t=' + Date.now();
                    window.location.replace(
                        (data.user.role === 'superadmin' || data.user.role === 'admin')
                            ? '/admin' + cb : '/app' + cb
                    );
                } else {
                    errBox.textContent = data.error || 'Invalid credentials';
                    errBox.classList.add('show');
                }
            } catch (e) {
                errBox.textContent = 'Connection error. Please try again.';
                errBox.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = 'Sign in';
            }
        }

        document.getElementById('password').addEventListener('keyup', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('username').addEventListener('keyup', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>

</html>
