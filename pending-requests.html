<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Requests - Label Scanner</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card: #2d2d44;
            --accent: #6c63ff;
            --accent2: #4a4a6a;
            --text: #ffffff;
            --text2: #a0a0b0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --sidebar: #2d2d44;
            --input-bg: #1e1e2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0f0f23 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #2d2d44;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 12px;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .sidebar-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #6c63ff;
            padding: 12px 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #a0a0b0;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .sidebar-btn.active {
            background: #6c63ff;
            color: #ffffff;
        }

        .sidebar-btn.danger {
            color: #ef4444;
        }

        .sidebar-btn.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 12px 0;
        }

        .sidebar-section {
            font-size: 0.7rem;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 14px;
            margin-top: 8px;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 40px;
            max-width: calc(100% - 220px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .header-copy h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .header-copy p {
            color: var(--text2);
            font-size: 0.95rem;
        }

        .summary-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(108, 99, 255, 0.14);
            border: 1px solid rgba(108, 99, 255, 0.3);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 16px;
            white-space: nowrap;
        }

        .summary-pill strong {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .action-btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .table-container {
            background: var(--card);
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            color: var(--text2);
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            color: var(--text);
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.submitted,
        .status-badge.pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.approved {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.completed {
            background: rgba(108, 99, 255, 0.2);
            color: var(--accent);
        }

        .status-badge.rejected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text2);
        }

        @media (max-width: 720px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar {
                width: 100%;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="css/dashboard-theme.css">
</head>

<body class="dashboard-shell">
    <nav class="sidebar">
        <div class="sidebar-logo">🛠️ Admin Panel</div>

        <div class="sidebar-section">Navigation</div>
        <button class="sidebar-btn" onclick="location.href='/admin'">📊 <span>Dashboard</span></button>
        <button class="sidebar-btn" onclick="location.href='/pivot'">📈 <span>Ledger Entries</span></button>
        <button class="sidebar-btn" onclick="location.href='/analytics'">📉 <span>Analytics</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer'">🚚 <span>Transfer Request</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer-reports'">📋 <span>Transfer Reports</span></button>
        <button class="sidebar-btn active" onclick="location.href='/pending-requests'">⏳ <span>Pending Requests</span></button>
        <button class="sidebar-btn" onclick="location.href='/users'">👥 <span>Users</span></button>
        <button class="sidebar-btn" id="btn-branches" style="display:none;" onclick="location.href='/branches'">🏢 <span>Branches &amp; Houses</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section">Actions</div>
        <button class="sidebar-btn" onclick="location.href='/app'">📷 <span>Scanner</span></button>
        <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="handleCSVUpload(event)">
        <button class="sidebar-btn" onclick="document.getElementById('csv-upload').click()">📤 <span>Upload CSV</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer-reports'">📋 <span>All Requests</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer-receipts'">📥 <span>Transfer Receipts</span></button>

        <div style="flex:1;"></div>
        <div class="sidebar-divider"></div>
        <button class="sidebar-btn danger" onclick="logout()">🚪 <span>Logout</span></button>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <div class="header-copy">
                    <h1>Pending Requests</h1>
                    <p>Requests that are still waiting to be processed or completed.</p>
                </div>
                <div class="toolbar">
                    <div class="summary-pill">Pending <strong id="pending-count">0</strong></div>
                    <button class="action-btn" onclick="loadRequests()">🔄 Refresh</button>
                </div>
            </div>

            <div class="table-container">
                <table id="requests-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Info</th>
                            <th>Location</th>
                            <th>Truck</th>
                            <th>Requested By</th>
                            <th>Requested At</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="7" style="text-align:center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/check-auth')
            .then(res => res.json())
            .then(data => {
                if (!data.authenticated) window.location.href = '/';

                if (data.role === 'superadmin') {
                    const btnBranches = document.getElementById('btn-branches');
                    if (btnBranches) btnBranches.style.display = 'flex';
                }
            });

        document.addEventListener('DOMContentLoaded', loadRequests);

        async function loadRequests() {
            const tbody = document.getElementById('table-body');
            const pendingCount = document.getElementById('pending-count');

            try {
                const response = await fetch(`/api/transfer/requests?status=pending&_t=${Date.now()}`);
                const data = await response.json();

                if (!data.success || !Array.isArray(data.requests)) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--error)">Failed to load requests</td></tr>';
                    pendingCount.textContent = '0';
                    return;
                }

                const rows = data.requests.filter(req => ['submitted', 'pending'].includes((req.status || '').toLowerCase()));
                pendingCount.textContent = rows.length;

                if (rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No pending requests found</td></tr>';
                    return;
                }

                tbody.innerHTML = rows.map(req => {
                    const createdAt = req.created_at ? new Date(req.created_at).toLocaleString() : '-';
                    const statusLabel = req.status === 'submitted' ? 'Pending' : (req.status || 'pending');
                    const destinationLabel = req.destination_type === 'branch'
                        ? (req.destination_branch_name || '-')
                        : (req.production_room_name || '-');
                    const destinationSubtitle = req.destination_type === 'branch'
                        ? 'Destination Branch'
                        : (req.production_branch_name ? `Branch: ${req.production_branch_name}` : '');

                    return `
                        <tr>
                            <td>#${req.id}</td>
                            <td>
                                <div style="font-weight:600;color:var(--accent)">Qty ${req.quantity || 1}</div>
                                <div style="font-size:0.8rem;color:var(--text2)">Stocks: ${req.production_stock_count || 0}</div>
                            </td>
                            <td>
                                <div>From: ${req.source_branch_name || '-'}</div>
                                <div>To: ${destinationLabel}</div>
                                <div style="font-size:0.8rem;color:var(--text2)">
                                    ${destinationSubtitle}
                                </div>
                            </td>
                            <td>
                                <div>${req.truck_no ? `${req.truck_id || ''} - ${req.truck_no}` : '-'}</div>
                                ${req.truck_note ? `<div style="font-size:0.8rem;color:var(--text2);font-style:italic">${req.truck_note}</div>` : ''}
                            </td>
                            <td>
                                <div>${req.requested_by_name || '-'}</div>
                                ${req.notes ? `<div style="font-size:0.8rem;color:var(--text2);font-style:italic">"${req.notes}"</div>` : ''}
                            </td>
                            <td style="font-size:0.85rem">${createdAt}</td>
                            <td><span class="status-badge ${req.status || 'pending'}">${statusLabel}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to load pending requests:', err);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--error)">Network error</td></tr>';
                pendingCount.textContent = '0';
            }
        }

        function handleCSVUpload(event) {
            alert('CSV import is available from the main dashboard.');
            event.target.value = '';
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => window.location.href = '/');
        }
    </script>
</body>

</html>
