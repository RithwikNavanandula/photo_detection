<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches and Production Houses - Label Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1e1e2e;
            --card: #2d2d44;
            --text: #ffffff;
            --text2: #a0a0b0;
            --accent: #6c63ff;
            --accent2: #4a4a6a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg), #1a1a2e);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar - Unified with admin.html */
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #2d2d44;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 12px;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .sidebar-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #6c63ff;
            padding: 12px 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #a0a0b0;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .sidebar-btn.active {
            background: #6c63ff;
            color: #ffffff;
        }

        .sidebar-btn.danger {
            color: #ef4444;
        }

        .sidebar-btn.danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 12px 0;
        }

        .sidebar-section {
            font-size: 0.7rem;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 14px;
            margin-top: 8px;
        }

        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 20px;
            max-width: calc(100% - 220px);
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 60px;
                padding: 20px 8px;
            }

            .sidebar-logo {
                font-size: 0.9rem;
                text-align: center;
            }

            .sidebar-btn span {
                display: none;
            }

            .sidebar-section {
                display: none;
            }

            .main-content {
                margin-left: 60px;
                max-width: calc(100% - 60px);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        /* Sections */
        .section {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            margin-bottom: 16px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text2);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text);
        }

        /* Branch List */
        .branch-list {
            display: grid;
            gap: 16px;
        }

        .branch-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .branch-info h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .branch-info p {
            color: var(--text2);
            font-size: 0.9rem;
        }

        .branch-code {
            display: inline-block;
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #86efac;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn-small {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        .house-list {
            display: grid;
            gap: 16px;
        }

        .house-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .house-info h3 {
            font-size: 1.02rem;
            margin-bottom: 4px;
        }

        .house-info p {
            color: var(--text2);
            font-size: 0.9rem;
        }

        .tag {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(108, 99, 255, 0.16);
            color: #c4b5fd;
            font-size: 0.78rem;
        }

        .branch-stats {
            display: flex;
            gap: 16px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .no-data {
            text-align: center;
            color: var(--text2);
            padding: 20px;
        }

        @media (max-width: 720px) {
            .container {
                padding: 12px 0;
            }

            .section-grid {
                grid-template-columns: 1fr;
            }

            .branch-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .branch-info h3 {
                line-height: 1.4;
            }

            .branch-stats {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px;
            }

            #create-branch-form .btn-primary,
            #create-production-form .btn-primary {
                width: 100%;
            }

            .house-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="css/dashboard-theme.css">
</head>

<body class="dashboard-shell">
    <!-- Auth Check -->
    <script>
        const userData = localStorage.getItem('user');
        if (!userData) {
            window.location.href = '/';
        } else {
            const user = JSON.parse(userData);
            if (user.role !== 'superadmin') {
                alert('Access denied. Superadmin only.');
                window.location.href = '/admin';
            }
        }
    </script>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-logo">🛠️ Admin Panel</div>

        <div class="sidebar-section">Navigation</div>
        <button class="sidebar-btn" onclick="location.href='/admin'">📊 <span>Dashboard</span></button>
        <button class="sidebar-btn" onclick="location.href='/pivot'">📈 <span>Ledger Entries</span></button>
        <button class="sidebar-btn" onclick="location.href='/analytics'">📉 <span>Analytics</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer'">🚚 <span>Transfer Request</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer-reports'">📋 <span>Transfer
                Reports</span></button>
        <button class="sidebar-btn" onclick="location.href='/pending-requests'">⏳ <span>Pending
                Requests</span></button>
        <button class="sidebar-btn" onclick="location.href='/users'">👥 <span>Users</span></button>
        <button class="sidebar-btn active" onclick="location.href='/branches'">🏢 <span>Branches &amp; Houses</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section">Actions</div>
        <button class="sidebar-btn" onclick="location.href='/app'">📷 <span>Scanner</span></button>

        <div style="flex:1;"></div>
        <div class="sidebar-divider"></div>
        <button class="sidebar-btn danger" onclick="logout()">🚪 <span>Logout</span></button>
    </nav>

    <div class="main-content">
        <div class="container">
            <header class="header">
                <div>
                    <h1>🏢 Branches and Production Houses</h1>
                    <p style="color:var(--text2);margin-top:6px;">Add or remove branches and the production houses attached to them.</p>
                </div>
            </header>

            <div id="page-message" class="message"></div>

            <div class="section-grid">
                <div class="section">
                    <h2>➕ Create New Branch</h2>
                    <form id="create-branch-form" onsubmit="createBranch(event)">
                        <div class="form-group">
                            <label>Branch Name</label>
                            <input type="text" id="branch-name" placeholder="E.g. North Warehouse" required>
                        </div>
                        <div class="form-group">
                            <label>Branch Code (Unique ID)</label>
                            <input type="text" id="branch-code" placeholder="E.g. NORTH01" required
                                style="text-transform: uppercase;">
                        </div>
                        <button type="submit" class="btn btn-primary">Create Branch</button>
                    </form>
                </div>

                <div class="section">
                    <h2>➕ Create Production House</h2>
                    <form id="create-production-form" onsubmit="createProductionHouse(event)">
                        <div class="form-group">
                            <label>Production House Name</label>
                            <input type="text" id="production-name" placeholder="E.g. Main Production House" required>
                        </div>
                        <div class="form-group">
                            <label>Branch</label>
                            <select id="production-branch-id" required style="width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);color:var(--text);">
                                <option value="">Loading branches...</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Create Production House</button>
                    </form>
                </div>
            </div>

            <div class="section">
                <h2>📋 Existing Branches</h2>
                <div class="branch-list" id="branch-list">
                    <div class="no-data">Loading...</div>
                </div>
            </div>

            <div class="section">
                <h2>🏭 Existing Production Houses</h2>
                <div class="house-list" id="production-list">
                    <div class="no-data">Loading...</div>
                </div>
            </div>
        </div>

        <script>
            function showMessage(text, type = 'success') {
                const el = document.getElementById('page-message');
                el.textContent = text;
                el.className = `message ${type}`;
            }

            function clearMessage() {
                const el = document.getElementById('page-message');
                el.textContent = '';
                el.className = 'message';
            }

            async function loadBranches() {
                try {
                    const response = await fetch('/api/admin/branches');
                    const data = await response.json();
                    const branches = data.branches || [];
                    renderBranches(branches);
                    populateBranchSelect(branches);
                } catch (err) {
                    console.error('Error loading branches:', err);
                    document.getElementById('branch-list').innerHTML = '<div class="no-data">Failed to load branches</div>';
                }
            }

            async function loadProductionHouses() {
                try {
                    const response = await fetch('/api/admin/production-houses');
                    const data = await response.json();
                    renderProductionHouses(data.production_houses || []);
                } catch (err) {
                    console.error('Error loading production houses:', err);
                    document.getElementById('production-list').innerHTML = '<div class="no-data">Failed to load production houses</div>';
                }
            }

            function populateBranchSelect(branches) {
                const select = document.getElementById('production-branch-id');
                select.innerHTML = '<option value="">Select a branch</option>';
                branches.forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch.id;
                    option.textContent = `${branch.name} (${branch.code})`;
                    select.appendChild(option);
                });
            }

            function renderBranches(branches) {
                const container = document.getElementById('branch-list');

                if (branches.length === 0) {
                    container.innerHTML = '<div class="no-data">No branches found</div>';
                    return;
                }

                container.innerHTML = branches.map(branch => `
                <div class="branch-card">
                    <div class="branch-info">
                        <h3>${branch.name} <span class="branch-code">${branch.code}</span></h3>
                        <p>ID: ${branch.id}</p>
                        <p>${branch.production_house_count || 0} production house(s)</p>
                    </div>
                    <div class="branch-stats">
                        <div class="stat-badge" title="Users">
                            👥 ${branch.user_count} Users
                        </div>
                        <div class="stat-badge" title="Scans">
                            📦 ${branch.scan_count} Scans
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteBranch(${branch.id}, ${JSON.stringify(branch.name)})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
            }

            function renderProductionHouses(rooms) {
                const container = document.getElementById('production-list');

                if (rooms.length === 0) {
                    container.innerHTML = '<div class="no-data">No production houses found</div>';
                    return;
                }

                container.innerHTML = rooms.map(room => `
                    <div class="house-card">
                        <div class="house-info">
                            <h3>${room.name}</h3>
                            <p>ID: ${room.id}</p>
                            <p>Branch: ${room.branch_name || '-'} <span class="branch-code">${room.branch_code || ''}</span></p>
                            <span class="tag">${room.transfer_count || 0} transfer(s), ${room.production_stock_count || 0} stock record(s)</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteProductionHouse(${room.id}, ${JSON.stringify(room.name)})">Delete</button>
                        </div>
                    </div>
                `).join('');
            }

            async function createBranch(e) {
                e.preventDefault();

                const name = document.getElementById('branch-name').value.trim();
                const code = document.getElementById('branch-code').value.trim().toUpperCase();
                const btn = e.target.querySelector('button');

                if (!name || !code) return;

                btn.disabled = true;
                btn.textContent = 'Creating...';

                try {
                    const response = await fetch('/api/admin/branches', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, code })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage('Branch created successfully.', 'success');
                        document.getElementById('create-branch-form').reset();
                        await loadBranches();
                        await loadProductionHouses();
                    } else {
                        showMessage(result.error || 'Failed to create branch', 'error');
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Create Branch';
                }
            }

            async function createProductionHouse(e) {
                e.preventDefault();

                const name = document.getElementById('production-name').value.trim();
                const branchId = document.getElementById('production-branch-id').value;
                const btn = e.target.querySelector('button');

                if (!name || !branchId) return;

                btn.disabled = true;
                btn.textContent = 'Creating...';

                try {
                    const response = await fetch('/api/admin/production-houses', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, branch_id: Number(branchId) })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage('Production house created successfully.', 'success');
                        document.getElementById('create-production-form').reset();
                        await loadProductionHouses();
                    } else {
                        showMessage(result.error || 'Failed to create production house', 'error');
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Create Production House';
                }
            }

            async function deleteBranch(id, name) {
                if (!confirm(`Delete branch "${name}"? This cannot be undone.`)) return;

                try {
                    const response = await fetch(`/api/admin/branches/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        showMessage('Branch deleted successfully.', 'success');
                        await loadBranches();
                        await loadProductionHouses();
                    } else {
                        showMessage(result.error || 'Failed to delete branch', 'error');
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            }

            async function deleteProductionHouse(id, name) {
                if (!confirm(`Delete production house "${name}"? This cannot be undone.`)) return;

                try {
                    const response = await fetch(`/api/admin/production-houses/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.success) {
                        showMessage('Production house deleted successfully.', 'success');
                        await loadProductionHouses();
                    } else {
                        showMessage(result.error || 'Failed to delete production house', 'error');
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            }

            async function logout() {
                try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { }
                localStorage.removeItem('user');
                window.location.href = '/';
            }

            // Load on page load
            loadBranches();
            loadProductionHouses();
        </script>
    </div>
</body>

</html>
