<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trucks - Label Scanner</title>
    <style>
        :root {
            --bg: #f5f8fd;
            --panel: rgba(255, 255, 255, 0.86);
            --accent: #1768a6;
            --accent2: #4f8fc1;
            --accent-soft: #e8f2fb;
            --text: #203345;
            --text2: #6d8195;
            --border: #d7e2ec;
            --shadow: 0 20px 56px rgba(16, 52, 87, 0.08);
            --shadow-soft: 0 12px 30px rgba(16, 52, 87, 0.06);
            --error: #d85a64;
            --success: #2a9d67;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(23, 104, 166, 0.08), transparent 28%),
                radial-gradient(circle at top right, rgba(79, 143, 193, 0.14), transparent 20%),
                linear-gradient(180deg, #f8fbfe 0%, #edf3fa 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(23, 104, 166, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(23, 104, 166, 0.022) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.28), transparent 85%);
        }

        .sidebar {
            width: 248px;
            min-height: calc(100vh - 32px);
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 18px 14px;
            position: fixed;
            left: 16px;
            top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .sidebar-logo {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(23, 104, 166, 0.08), rgba(79, 143, 193, 0.22));
            color: var(--accent);
            font-size: 1.02rem;
            font-weight: 800;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: none;
            border-radius: 18px;
            background: transparent;
            color: var(--text2);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .sidebar-btn:hover {
            background: rgba(23, 104, 166, 0.08);
            color: var(--text);
            transform: translateX(3px);
        }

        .sidebar-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 12px 24px rgba(23, 104, 166, 0.22);
        }

        .sidebar-btn.danger { color: var(--error); }
        .sidebar-btn.danger:hover { background: rgba(216, 90, 100, 0.1); color: #b94b55; }
        .sidebar-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #c6d5e2, transparent);
            margin: 10px 10px 4px;
        }
        .sidebar-section {
            font-size: 0.72rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 8px 14px 2px;
            margin-top: 2px;
            font-weight: 800;
        }

        .main-content {
            flex: 1;
            margin-left: 296px;
            padding: 24px 24px 40px;
            max-width: calc(100% - 296px);
        }

        .container { max-width: 1480px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px 24px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.86);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(16px);
        }

        .header h1 {
            font-size: clamp(1.4rem, 2vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .header p { color: var(--text2); margin-top: 6px; font-size: 0.95rem; }

        .badge {
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid #d4e6f5;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 18px;
        }

        .panel {
            background: rgba(255,255,255,0.86);
            border: 1px solid rgba(215,226,236,0.95);
            border-radius: 26px;
            padding: 20px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(14px);
        }

        .panel h2 {
            font-size: 1rem;
            margin-bottom: 14px;
            font-weight: 800;
            color: var(--text);
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text2);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #f5f8fc;
            color: var(--text);
            outline: none;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-control:focus {
            background: #fff;
            border-color: rgba(23, 104, 166, 0.45);
            box-shadow: 0 0 0 4px rgba(23, 104, 166, 0.12);
        }

        .field-note {
            display: block;
            margin-top: 6px;
            color: var(--text2);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 12px 24px rgba(23, 104, 166, 0.18);
        }

        .btn-secondary {
            background: #f5f8fc;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat {
            padding: 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
            border: 1px solid var(--border);
        }

        .stat strong {
            display: block;
            color: var(--text2);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .stat span {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
        }

        .search {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: #f5f8fc;
            color: var(--text);
            outline: none;
            margin-bottom: 12px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .truck-table-wrap {
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            background: #f5f8fc;
            color: var(--text2);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px 16px;
            color: var(--text);
            border-top: 1px solid #edf2f7;
            vertical-align: top;
        }

        tbody tr:hover td { background: #f8fbfe; }

        .truck-title {
            font-weight: 800;
            color: var(--accent);
        }

        .truck-note {
            margin-top: 4px;
            color: var(--text2);
            font-size: 0.85rem;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .row-actions button {
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
        }

        .row-actions .edit {
            background: #edf6fd;
            color: var(--accent);
        }

        .row-actions .delete {
            background: #fff3f4;
            color: var(--error);
        }

        .status {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            display: none;
        }
        .status.success { display: block; background: rgba(42,157,103,0.10); border: 1px solid rgba(42,157,103,0.22); color: #17724d; }
        .status.error { display: block; background: rgba(216,90,100,0.10); border: 1px solid rgba(216,90,100,0.22); color: #b94b55; }

        .empty {
            padding: 18px;
            text-align: center;
            color: var(--text2);
            background: linear-gradient(180deg, #ffffff, #f9fbfe);
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 80px;
                left: 12px;
                top: 12px;
                padding: 14px 10px;
                border-radius: 24px;
                min-height: calc(100vh - 24px);
            }
            .sidebar-logo {
                font-size: 0.95rem;
                text-align: center;
                justify-content: center;
            }
            .sidebar-btn span { display: none; }
            .sidebar-section { display: none; }
            .main-content {
                margin-left: 108px;
                max-width: calc(100% - 108px);
                padding: 18px 16px 28px;
            }
            .grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 720px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px 18px;
                border-radius: 22px;
            }
            .panel { padding: 16px; border-radius: 22px; }
            .stats { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body class="dashboard-shell">
    <nav class="sidebar">
        <div class="sidebar-logo">🛠️ Admin Panel</div>

        <div class="sidebar-section">Navigation</div>
        <button class="sidebar-btn" onclick="location.href='/admin'">📊 <span>Dashboard</span></button>
        <button class="sidebar-btn" onclick="location.href='/pivot'">📈 <span>Ledger Entries</span></button>
        <button class="sidebar-btn" onclick="location.href='/analytics'">📉 <span>Analytics</span></button>
        <button class="sidebar-btn" onclick="location.href='/transfer'">🚚 <span>Transfer Request</span></button>
        <button class="sidebar-btn active" onclick="location.href='/trucks'">🚛 <span>Trucks</span></button>
        <button class="sidebar-btn" onclick="location.href='/authorizations'">🔐 <span>Authorizations</span></button>
        <button class="sidebar-btn" onclick="location.href='/users'">👥 <span>Users</span></button>
        <button class="sidebar-btn" onclick="location.href='/branches'">🏢 <span>Branches &amp; Houses</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section">Actions</div>
        <button class="sidebar-btn" onclick="location.href='/app'">📷 <span>Scanner</span></button>
        <button class="sidebar-btn danger" onclick="logout()">🚪 <span>Logout</span></button>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="header">
                <div>
                    <h1>Trucks</h1>
                    <p>Browse and add truck numbers used in transfer requests.</p>
                </div>
                <div class="badge" id="truck-count-badge">0 trucks</div>
            </div>

            <div class="grid">
                <div class="panel">
                    <h2>Add Truck</h2>
                    <div class="form-group">
                        <label>Truck No</label>
                        <input id="truck-no" class="form-control" type="text" placeholder="e.g. T-1024">
                    </div>
                    <div class="form-group">
                        <label>Note (Optional)</label>
                        <input id="truck-note" class="form-control" type="text" placeholder="Driver, company, color, etc.">
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="saveTruck()">Save Truck</button>
                        <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
                    </div>
                    <div id="status" class="status"></div>
                </div>

                <div class="panel">
                    <h2>Truck List</h2>
                    <input id="search" class="search" type="text" placeholder="Search trucks..." oninput="renderTrucks()">
                    <div class="truck-table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Truck No</th>
                                    <th>Note</th>
                                    <th>Added</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="truck-body">
                                <tr><td colspan="5" class="empty">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let trucks = [];

        fetch('/api/check-auth')
            .then(r => r.json())
            .then(data => {
                if (!data.authenticated) {
                    window.location.href = '/';
                    return;
                }
                if (data.role !== 'superadmin' && !(data.permissions || []).includes('create_transfer')) {
                    window.location.href = '/app';
                    return;
                }
                loadTrucks();
            });

        async function loadTrucks() {
            const body = document.getElementById('truck-body');
            try {
                const res = await fetch('/api/trucks');
                const data = await res.json();
                if (!data.success) {
                    body.innerHTML = `<tr><td colspan="5" class="empty">${escapeHtml(data.error || 'Failed to load trucks')}</td></tr>`;
                    return;
                }
                trucks = data.trucks || [];
                document.getElementById('truck-count-badge').textContent = `${trucks.length} truck${trucks.length === 1 ? '' : 's'}`;
                renderTrucks();
            } catch (err) {
                body.innerHTML = '<tr><td colspan="4" class="empty">Network error</td></tr>';
            }
        }

        function renderTrucks() {
            const body = document.getElementById('truck-body');
            const q = (document.getElementById('search').value || '').toLowerCase().trim();
            const filtered = trucks.filter(truck => {
                const hay = `${truck.id || ''} ${truck.truck_no || ''} ${truck.note || ''}`.toLowerCase();
                return !q || hay.includes(q);
            });

            if (!filtered.length) {
                body.innerHTML = '<tr><td colspan="5" class="empty">No trucks found.</td></tr>';
                return;
            }

            body.innerHTML = filtered.map(truck => `
                <tr>
                    <td>#${escapeHtml(truck.id)}</td>
                    <td><div class="truck-title">${escapeHtml(truck.truck_no)}</div></td>
                    <td><div class="truck-note">${escapeHtml(truck.note || '-')}</div></td>
                    <td>${escapeHtml(formatDate(truck.created_at))}</td>
                    <td>
                        <div class="row-actions">
                            <button class="edit" onclick="editTruck(${truck.id}, ${escapeJs(truck.truck_no)}, ${escapeJs(truck.note || '')})">Edit</button>
                            <button class="delete" onclick="deleteTruck(${truck.id}, ${escapeJs(truck.truck_no)})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function saveTruck() {
            const truckNo = document.getElementById('truck-no').value.trim();
            const note = document.getElementById('truck-note').value.trim();
            const status = document.getElementById('status');

            if (!truckNo) {
                showStatus('Truck number is required.', 'error');
                return;
            }

            try {
                const res = await fetch('/api/trucks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ truck_no: truckNo, note })
                });
                const data = await res.json();
                if (!data.success) {
                    showStatus(data.error || 'Failed to save truck.', 'error');
                    return;
                }
                clearForm();
                showStatus(`Truck ${data.truck.truck_no} added.`, 'success');
                await loadTrucks();
            } catch (err) {
                showStatus('Network error while saving truck.', 'error');
            }
        }

        async function editTruck(id, truckNo, note) {
            const nextTruckNo = prompt('Truck number:', truckNo);
            if (nextTruckNo === null) return;
            const nextNote = prompt('Note (optional):', note);
            if (nextNote === null) return;

            try {
                const res = await fetch(`/api/trucks/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ truck_no: nextTruckNo.trim(), note: nextNote.trim() })
                });
                const data = await res.json();
                if (!data.success) {
                    showStatus(data.error || 'Failed to update truck.', 'error');
                    return;
                }
                showStatus(`Truck ${data.truck.truck_no} updated.`, 'success');
                await loadTrucks();
            } catch (err) {
                showStatus('Network error while updating truck.', 'error');
            }
        }

        async function deleteTruck(id, truckNo) {
            if (!confirm(`Delete truck ${truckNo}?`)) return;

            try {
                const res = await fetch(`/api/trucks/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (!data.success) {
                    showStatus(data.error || 'Failed to delete truck.', 'error');
                    return;
                }
                showStatus(`Truck ${truckNo} deleted.`, 'success');
                await loadTrucks();
            } catch (err) {
                showStatus('Network error while deleting truck.', 'error');
            }
        }

        function clearForm() {
            document.getElementById('truck-no').value = '';
            document.getElementById('truck-note').value = '';
        }

        function showStatus(text, type) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = text;
        }

        function formatDate(value) {
            if (!value) return '-';
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function escapeJs(value) {
            return `'${String(value ?? '').replaceAll('\\', '\\\\').replaceAll("'", "\\'")}'`;
        }

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => window.location.href = '/');
        }
    </script>
</body>
</html>
